<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>ATLAS OS — animated boot preview</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #01030b;
    }
    .splash {
      position: relative;
      width: min(100vw, calc(100vh * 1024 / 600));
      aspect-ratio: 1024 / 600;
    }
    .artwork { display: block; width: 100%; height: 100%; }
    .loading-track {
      position: absolute;
      left: 41.2109375%;
      top: 91%;
      width: 17.578125%;
      height: .666667%;
      min-height: 2px;
      border-radius: .5px;
      overflow: hidden;
      background: #112442;
    }
    .loading-light {
      width: 100%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #245fdf, #49b9ff);
      box-shadow: 0 0 10px #2879ff80;
      transform: scaleX(0);
      transform-origin: left center;
      will-change: transform;
    }
  </style>
</head>
<body>
  <!-- Visual preview only: this animation does not report real boot progress. -->
  <main class="splash" aria-label="ATLAS OS 1.0 boot screen">
    <img class="artwork" src="atlas-splash-v2.png"
         width="1024" height="600"
         alt="ATLAS OS 1.0. Booting... OpenATLAS by Sami González Kamel.">
    <div class="loading-track" role="progressbar" aria-label="Booting — simulated preview"
         aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="loading-light"></div>
    </div>
  </main>
  <script>
    // Preview timing only. A real boot integration must supply real progress.
    const track = document.querySelector('.loading-track');
    const light = document.querySelector('.loading-light');
    const artwork = document.querySelector('.artwork');
    const duration = 1200;

    function showProgress(value) {
      light.style.transform = `scaleX(${value})`;
      track.setAttribute('aria-valuenow', Math.round(value * 100));
    }

    function startPreview() {
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
        showProgress(1);
        return;
      }
      const started = performance.now();
      function frame(now) {
        const elapsed = Math.min(1, Math.max(0, (now - started) / duration));
        showProgress((1 - Math.cos(Math.PI * elapsed)) / 2);
        if (elapsed < 1) requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }

    if (artwork.complete) startPreview();
    else artwork.addEventListener('load', startPreview, { once: true });
  </script>
</body>
</html>
