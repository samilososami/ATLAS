[global]

# ATLAS A1 appears as this Spotify Connect device on the local network.
device_name = "ATLAS A1"
device_type = "speaker"

# Keep Spotifyd's OAuth/session data private and outside the repository.
cache_path = "/home/atlas/.atlas/spotifyd/cache"
no_audio_cache = true

# A local MPRIS interface makes future playback telemetry and control cheap.
use_mpris = true
dbus_type = "session"

# Discovery stays on for the official Spotify clients on the home LAN.
disable_discovery = false
zeroconf_port = 45225

# Music is initially routed to the ATLAS A1 display speakers. ATLAS voice keeps
# using the normal PulseAudio default independently of this dedicated stream.
backend = "pulseaudio"
device = "alsa_output.platform-107c701400.hdmi.hdmi-stereo"
bitrate = 320
volume_controller = "softvol"
initial_volume = 70
