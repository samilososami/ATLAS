# Keep the ATLAS A1 audio graph on one clock domain. The USB microphone is
# natively 48 kHz and PipeWire resamples HDMI into this graph when necessary.
context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 48000 ]
    default.clock.quantum       = 480
    default.clock.min-quantum   = 256
    default.clock.max-quantum   = 2048
}
